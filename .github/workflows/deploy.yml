name: Deploy to S3

on:
  push:
    branches: [ release, staging ]
  workflow_dispatch:
    inputs:
      base_href:
        description: 'Base href for deployment (e.g., /somatic/)'
        required: false
        default: '/somatic/'
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: drewmayo.com cloudfront

    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          BASE_HREF="${{ github.event.inputs.base_href }}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"
        else
          if [ "${{ github.ref }}" = "refs/heads/release" ]; then
            BASE_HREF="/somatic/"
            ENVIRONMENT="production"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            BASE_HREF="/somatic-staging/"
            ENVIRONMENT="staging"
          fi
        fi

        echo "base_href=${BASE_HREF}" >> $GITHUB_OUTPUT
        echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
        echo "s3_bucket=${{ secrets.AWS_S3_BUCKET_NAME }}" >> $GITHUB_OUTPUT
        echo "cloudfront_distribution_id=${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_OUTPUT

    - name: Prepare publish directory
      run: |
        VERSION=$(git rev-parse --short HEAD)
        BASE_HREF="${{ steps.vars.outputs.base_href }}"
        echo "Base href: $BASE_HREF"
        echo "Version: $VERSION"

        mkdir -p publish

        # Copy files preserving directory structure
        cp index.html styles.css sw.js manifest.json icon.svg icon-maskable.svg version.json publish/
        cp -r js publish/
        cp -r vendor publish/

        # Inject <base> tag for correct subpath resolution
        sed -i "s|<head>|<head>\n    <base href=\"${BASE_HREF}\">|" publish/index.html

        # Update manifest start_url and scope
        sed -i "s|\"start_url\": \"./\"|\"start_url\": \"${BASE_HREF}\", \"scope\": \"${BASE_HREF}\"|" publish/manifest.json

        # Replace version and build date placeholders
        BUILD_DATE=$(date -u +"%Y-%m-%d")
        sed -i "s|__VERSION__|${VERSION}|g" publish/sw.js publish/index.html publish/version.json
        sed -i "s|__BUILD_DATE__|${BUILD_DATE}|g" publish/index.html

        echo "Publish directory contents:"
        find publish -type f | sort

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4.1.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to S3
      run: |
        SUBDIR=$(echo "${{ steps.vars.outputs.base_href }}" | sed 's|^/||' | sed 's|/$||')

        # Static assets — long cache
        aws s3 sync "publish/" "s3://${{ steps.vars.outputs.s3_bucket }}/${SUBDIR}/" \
          --delete \
          --cache-control "public, max-age=31536000, immutable" \
          --exclude "*.html" \
          --exclude "manifest.json" \
          --exclude "sw.js"

        # HTML + PWA files — short cache so updates are picked up quickly
        aws s3 sync "publish/" "s3://${{ steps.vars.outputs.s3_bucket }}/${SUBDIR}/" \
          --cache-control "public, max-age=300, must-revalidate" \
          --include "*.html" \
          --include "manifest.json" \
          --include "sw.js" \
          --include "version.json"

        # sw.js — no-store so iOS Safari always fetches fresh (it ignores the SW-update cache bypass spec)
        aws s3 cp "publish/sw.js" "s3://${{ steps.vars.outputs.s3_bucket }}/${SUBDIR}/sw.js" \
          --cache-control "no-store"

    - name: Invalidate CloudFront cache
      if: ${{ steps.vars.outputs.cloudfront_distribution_id != '' }}
      run: |
        SUBDIR=$(echo "${{ steps.vars.outputs.base_href }}" | sed 's|^/||' | sed 's|/$||')
        aws cloudfront create-invalidation \
          --distribution-id "${{ steps.vars.outputs.cloudfront_distribution_id }}" \
          --paths "/${SUBDIR}/*"
        echo "CloudFront invalidation triggered for /${SUBDIR}/*"

    - name: Deploy summary
      run: |
        echo "## Deploy Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** ${{ steps.vars.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "**Base href:** ${{ steps.vars.outputs.base_href }}" >> $GITHUB_STEP_SUMMARY
        echo "**URL:** https://drewmayo.com${{ steps.vars.outputs.base_href }}" >> $GITHUB_STEP_SUMMARY
        echo "**S3 bucket:** ${{ steps.vars.outputs.s3_bucket }}" >> $GITHUB_STEP_SUMMARY
        if [ -n "${{ steps.vars.outputs.cloudfront_distribution_id }}" ]; then
          echo "**CloudFront distribution:** ${{ steps.vars.outputs.cloudfront_distribution_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Cache invalidation:** Triggered" >> $GITHUB_STEP_SUMMARY
        fi
