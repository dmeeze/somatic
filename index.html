<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF85B3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Somatic</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts — all 6 theme pairings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&family=Cinzel:wght@600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Exo+2:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700;800&family=Orbitron:wght@600;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Rajdhani:wght@400;600;700&display=swap">
  <!-- Font Awesome Pro 5.15.4 (self-hosted) -->
  <link rel="stylesheet" href="vendor/fontawesome/all.min.css">
  <!-- SortableJS (Stage 2: CDN; Stage 4: self-hosted) -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <!-- Build info — tokens replaced by CI -->
  <script>window.APP_VERSION='__VERSION__';window.APP_BUILD_DATE='__BUILD_DATE__';</script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── Home screen ──────────────────────────────────────────────────────── -->
  <section id="home" class="screen screen--home" aria-label="Somatic home"></section>

  <!-- ── Communication card ──────────────────────────────────────────────── -->
  <section id="card" class="screen screen--card" aria-label="Communication card" aria-modal="true"></section>

  <!-- ── Settings ────────────────────────────────────────────────────────── -->
  <section id="settings" class="screen screen--settings" aria-label="Settings"></section>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
